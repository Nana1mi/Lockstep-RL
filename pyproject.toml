[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lockstep-rl"
version = "0.1.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "RL rollout extension of nano-vllm with token logprobs and safe weight synchronization"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.8.0",
    "transformers>=5.5.4",
    "xxhash",
    "numpy",
    "safetensors",
    "tqdm",
]

[project.optional-dependencies]
gpu = ["triton>=3.4.0", "flash-attn==2.8.3.post2"]
dev = ["ruff", "matplotlib"]
data = ["datasets"]

[project.urls]
Upstream="https://github.com/GeeeekExplorer/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*", "lockstep_rl*"]
